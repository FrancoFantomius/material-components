name: Deploy Documentation to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy Documentation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Documentation
        uses: FrancoFantomius/docs-gen@v1
        with:
          docs-dir: 'docs'
          output-dir: '_site'
          project-title: 'Material Components'
          project-description: 'Reusable, accessible, and lightweight Material Design 3 Web Components built with Lit.'
          github-url: 'https://github.com/FrancoFantomius/material-components'

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
